<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card" id="birthdayCard">
    <!-- ОБКЛАДИНКА (Ліва частина при відкритті) -->
    <div class="front">
        <!-- Зовнішня сторона (Торт) -->
        <div class="front-side">
            <div class="hover-text">to the most beautiful girl</div>
            <div class="cover-shape-large">
                <div class="shape-diamond"></div>
                <div class="shape-block"></div>
            </div>
            <div class="cover-shape-small">
                <div class="shape-diamond"></div>
                <div class="shape-block"></div>
            </div>
            <div class="cake">
                <div class="layer layer-bottom"></div>
                <div class="layer layer-middle"></div>
                <div class="layer layer-top"></div>
                <div class="icing"></div>
                <div class="drip drip1"></div>
                <div class="drip drip2"></div>
                <div class="drip drip3"></div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
            </div>
        </div>

        <!-- Внутрішня сторона (Твоє фото) -->
        <div class="back-side">
            <!-- Встав посилання на своє фото в src -->
            <img src="https://i.ibb.co/ynYdHmhb/IMG-20260504-195313.jpg" alt="Birthday Girl">
        </div>
    </div>

    <!-- ОСНОВА КАРТКИ (Права частина з текстом) -->
    <div class="text-container">
        <p id="head">Buon compleanno, Bestie girl!</p>
        <div>Your first digital birthday card! <br> Developed Just For You.</div>
        <p>Enjoy and Have It A Blast! 💥</p>
    </div>
</div>
  <script>
  const card = document.querySelector('.card');
  card.addEventListener('click', () => {
    card.classList.toggle('open');
  });
</script>
</body>
</html>
